openapi: 3.0.0
info:
  title: User Signup API Contract
  description: Frontend contract for user registration endpoint
  version: 1.0.0
  contact:
    name: Feature 005 - Frontend Authentication Integration

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.production.com
    description: Production server (HTTPS required)

paths:
  /api/auth/signup:
    post:
      summary: Register a new user account
      description: |
        Creates a new user account with email, password, and name.
        Returns a JWT token for immediate authentication.

        **User Story**: User Story 1 - New User Registration (P1)

        **Frontend Requirements**:
        - FR-002: Frontend MUST implement a signup form that calls this endpoint
        - FR-004: Frontend MUST store the JWT token in localStorage
        - FR-007: Frontend MUST redirect to main application after success

      operationId: signupUser
      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address (must be unique)
                  example: user@example.com
                  minLength: 3
                  maxLength: 255
                password:
                  type: string
                  format: password
                  description: User's password (min 8 chars, must contain letter and number)
                  example: SecurePass123
                  minLength: 8
                  maxLength: 255
                name:
                  type: string
                  description: User's display name (non-empty after trimming)
                  example: John Doe
                  minLength: 1
                  maxLength: 255

            examples:
              validSignup:
                summary: Valid signup request
                value:
                  email: newuser@example.com
                  password: SecurePass123
                  name: John Doe

              minimalPassword:
                summary: Minimum valid password
                value:
                  email: user@example.com
                  password: Pass1234
                  name: Jane Smith

      responses:
        '201':
          description: User account created successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - user
                properties:
                  access_token:
                    type: string
                    description: JWT token for authentication (valid for 24 hours)
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    enum: [bearer]
                    description: Token type (always "bearer")
                    example: bearer
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                    properties:
                      id:
                        type: integer
                        description: Unique user identifier
                        example: 123
                      email:
                        type: string
                        format: email
                        description: User's email address
                        example: newuser@example.com
                      name:
                        type: string
                        description: User's display name
                        example: John Doe

              examples:
                successResponse:
                  summary: Successful signup response
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjMiLCJlbWFpbCI6Im5ld3VzZXJAZXhhbXBsZS5jb20iLCJleHAiOjE3MDc0MzY4MDB9.signature
                    token_type: bearer
                    user:
                      id: 123
                      email: newuser@example.com
                      name: John Doe

        '400':
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message describing validation failure
                    example: Password must be at least 8 characters and contain at least one letter and one number

              examples:
                weakPassword:
                  summary: Password too weak
                  value:
                    detail: Password must be at least 8 characters and contain at least one letter and one number

                emptyName:
                  summary: Name is empty
                  value:
                    detail: Name cannot be empty

                shortPassword:
                  summary: Password too short
                  value:
                    detail: Password must be at least 8 characters

        '409':
          description: Conflict - Email already registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Error message indicating duplicate email
                    example: Email already registered

              examples:
                duplicateEmail:
                  summary: Email already exists
                  value:
                    detail: Email already registered

        '422':
          description: Unprocessable Entity - Invalid email format
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type: string
                          description: Location of the error
                        msg:
                          type: string
                          description: Error message
                        type:
                          type: string
                          description: Error type

              examples:
                invalidEmail:
                  summary: Invalid email format
                  value:
                    detail:
                      - loc: ["body", "email"]
                        msg: value is not a valid email address
                        type: value_error.email

        '500':
          description: Internal Server Error - Database or server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Generic error message
                    example: An error occurred during signup

              examples:
                serverError:
                  summary: Server error
                  value:
                    detail: An error occurred during signup

      security: []  # No authentication required for signup

components:
  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
        - name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        name:
          type: string
          minLength: 1

    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string

# Frontend Implementation Notes:
#
# 1. Client-side validation (FR-011):
#    - Email format validation before submission
#    - Password complexity check (min 8 chars, letter + number)
#    - Name non-empty validation
#
# 2. Token storage (FR-004):
#    - Store access_token in localStorage immediately after 201 response
#    - Key: 'auth_token'
#
# 3. Error handling (FR-006):
#    - 400: Display specific validation error to user
#    - 409: Display "Email already registered" message
#    - 422: Display "Invalid email format" message
#    - 500: Display generic error "An error occurred. Please try again."
#
# 4. Success handling (FR-007):
#    - Store token in localStorage
#    - Update authentication state (Context)
#    - Redirect to main application (e.g., /tasks or /dashboard)
#
# 5. Loading state (FR-012):
#    - Disable form submission while request is in progress
#    - Show loading indicator
#
# 6. Network errors (FR-016):
#    - Catch fetch errors and display "Unable to connect to server"
