openapi: 3.0.0
info:
  title: User Login API Contract
  description: Frontend contract for user authentication endpoint
  version: 1.0.0
  contact:
    name: Feature 005 - Frontend Authentication Integration

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.production.com
    description: Production server (HTTPS required)

paths:
  /api/auth/login:
    post:
      summary: Authenticate an existing user
      description: |
        Authenticates a user with email and password credentials.
        Returns a JWT token for accessing protected resources.

        **User Story**: User Story 2 - Existing User Login (P2)

        **Frontend Requirements**:
        - FR-003: Frontend MUST implement a login form that calls this endpoint
        - FR-004: Frontend MUST store the JWT token in localStorage
        - FR-007: Frontend MUST redirect to main application after success

      operationId: loginUser
      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's registered email address
                  example: user@example.com
                  minLength: 3
                  maxLength: 255
                password:
                  type: string
                  format: password
                  description: User's password
                  example: SecurePass123
                  minLength: 1
                  maxLength: 255

            examples:
              validLogin:
                summary: Valid login request
                value:
                  email: user@example.com
                  password: SecurePass123

              anotherUser:
                summary: Another valid login
                value:
                  email: jane.doe@example.com
                  password: MyPassword1

      responses:
        '200':
          description: User authenticated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - user
                properties:
                  access_token:
                    type: string
                    description: JWT token for authentication (valid for 24 hours)
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    enum: [bearer]
                    description: Token type (always "bearer")
                    example: bearer
                  user:
                    type: object
                    required:
                      - id
                      - email
                      - name
                    properties:
                      id:
                        type: integer
                        description: Unique user identifier
                        example: 123
                      email:
                        type: string
                        format: email
                        description: User's email address
                        example: user@example.com
                      name:
                        type: string
                        description: User's display name
                        example: John Doe

              examples:
                successResponse:
                  summary: Successful login response
                  value:
                    access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjMiLCJlbWFpbCI6InVzZXJAZXhhbXBsZS5jb20iLCJleHAiOjE3MDc0MzY4MDB9.signature
                    token_type: bearer
                    user:
                      id: 123
                      email: user@example.com
                      name: John Doe

        '401':
          description: Unauthorized - Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Generic error message (does not reveal which field is incorrect)
                    example: Invalid email or password

              examples:
                invalidCredentials:
                  summary: Wrong password or non-existent email
                  value:
                    detail: Invalid email or password

        '422':
          description: Unprocessable Entity - Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc:
                          type: array
                          items:
                            type: string
                          description: Location of the error
                        msg:
                          type: string
                          description: Error message
                        type:
                          type: string
                          description: Error type

              examples:
                missingEmail:
                  summary: Email field missing
                  value:
                    detail:
                      - loc: ["body", "email"]
                        msg: field required
                        type: value_error.missing

                missingPassword:
                  summary: Password field missing
                  value:
                    detail:
                      - loc: ["body", "password"]
                        msg: field required
                        type: value_error.missing

        '500':
          description: Internal Server Error - Database or server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    description: Generic error message
                    example: An error occurred during login

              examples:
                serverError:
                  summary: Server error
                  value:
                    detail: An error occurred during login

      security: []  # No authentication required for login

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required:
        - access_token
        - token_type
        - user
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        user:
          $ref: '#/components/schemas/UserResponse'

    UserResponse:
      type: object
      required:
        - id
        - email
        - name
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string

# Frontend Implementation Notes:
#
# 1. Client-side validation (FR-011):
#    - Email format validation before submission
#    - Password non-empty validation
#    - Note: No password complexity check on login (only on signup)
#
# 2. Token storage (FR-004):
#    - Store access_token in localStorage immediately after 200 response
#    - Key: 'auth_token'
#
# 3. Error handling (FR-006):
#    - 401: Display generic message "Invalid email or password"
#    - Do NOT reveal whether email exists or password is wrong (security)
#    - 422: Display "Please fill in all required fields"
#    - 500: Display generic error "An error occurred. Please try again."
#
# 4. Success handling (FR-007):
#    - Store token in localStorage
#    - Update authentication state (Context)
#    - Redirect to main application (e.g., /tasks or /dashboard)
#
# 5. Loading state (FR-012):
#    - Disable form submission while request is in progress
#    - Show loading indicator
#
# 6. Network errors (FR-016):
#    - Catch fetch errors and display "Unable to connect to server"
#
# 7. Token expiration (FR-010):
#    - Token expires after 24 hours (backend enforced)
#    - Frontend should handle 401 responses on subsequent API calls
#    - Clear token and redirect to login when 401 detected
#
# 8. Security considerations:
#    - Generic error messages prevent user enumeration attacks
#    - Backend returns same 401 for wrong password and non-existent email
#    - Frontend should mirror this behavior in error display
